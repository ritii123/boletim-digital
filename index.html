<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <!-- Vinculando nosso arquivo de estilos CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">8º Ano — Estudante Exemplo</p>
    </header>

    <!-- Área de Acesso / Login por PIN -->
    <section id="area-login" class="login-box">
      <h2>Acesso ao Boletim</h2>
      <p class="info-aluno">Turma: <strong>8A</strong> | Chamada: <strong>33</strong></p>
      
      <div class="form-group">
        <label for="campo-pin">Digite seu PIN:</label>
        <input type="password" id="campo-pin" placeholder="****" maxlength="20">
      </div>
      
      <button id="btn-entrar" type="button">Entrar</button>
      <p id="msg-login" class="mensagem-status"></p>
    </section>

    <!-- Conteúdo Principal do Boletim (inicialmente escondido) -->
    <div id="conteudo-boletim" style="display: none;">
      
      <!-- Painel de Ações do Aluno -->
      <div class="painel-acoes">
        <button id="btn-alternar-edicao" type="button">Alterar dados</button>
        <button id="btn-salvar" type="button" style="display: none;">Salvar alterações</button>
        <p id="msg-boletim" class="mensagem-status"></p>
      </div>

      <!-- Área de Cards de Resumo -->
      <section class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media-geral" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-total-faltas" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Precisam de Atenção</h3>
          <p id="card-atencao" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Frequência Geral</h3>
          <p id="card-frequencia" class="card-value">—</p>
          <span class="card-subtext">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela Responsiva de Disciplinas -->
      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-boletim">
            <!-- As linhas da tabela serão inseridas automaticamente via JavaScript -->
          </tbody>
        </table>
      </section>

    </div>
  </div>

  <!-- Vinculando nosso código JavaScript -->
  <script src="script.js"></script>
</body>
</html>
